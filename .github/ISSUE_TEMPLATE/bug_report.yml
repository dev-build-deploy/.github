name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command or workflow, the config file and the smallest input that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or action ref you use, for example v2.1.1.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options: [Command line, GitHub Action, Pre-commit hook, Claude Code plugin, Library]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Paste the output. Remove any secret first.
      render: text
